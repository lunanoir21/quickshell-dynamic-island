<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Dynamic Island logo</title>
  <desc id="d">A monochrome audio waveform held inside a floating dynamic island.</desc>
  <style>
    :root {
      --tile-a: #FBFBFC;
      --tile-b: #ECEDF1;
      --tile-stroke: #101115;
      --tile-stroke-o: 0.12;
      --halo: #101115;
      --arches: #101115;
      --glow: #101115;
      --rim-a: #B9BEC5;
      --rim-a-w: 1;
      --rim-b: #585D66;
      --rim-b-w: 0.28;
      --rim-c: #C7CBD2;
      --rim-c-w: 0.6;
      --island: #0A0B0E;
      --island-stroke: #FFFFFF;
      --island-stroke-o: 0.10;
      --wave-a: #8B9098;
      --wave-b: #F4F6F8;
      --wave-c: #8B9098;
      --dot-fill: #0A0B0E;
      --dot-stroke: #FFFFFF;
      --spot: #555B64;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --tile-a: #15161A;
        --tile-b: #050506;
        --tile-stroke: #FFFFFF;
        --tile-stroke-o: 0.10;
        --halo: #DDE2E8;
        --arches: #FFFFFF;
        --glow: #DDE2E8;
        --rim-a: #8B9098;
        --rim-a-w: 0.55;
        --rim-b: #3A3D44;
        --rim-b-w: 0.2;
        --rim-c: #8B9098;
        --rim-c-w: 0.4;
        --island: #F1F2F4;
        --island-stroke: #101115;
        --island-stroke-o: 0.12;
        --wave-a: #8B9098;
        --wave-b: #0B0C0F;
        --wave-c: #8B9098;
        --dot-fill: #F1F2F4;
        --dot-stroke: #B0B4BB;
        --spot: #B0B4BB;
      }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--tile-a)"/>
      <stop offset="1" stop-color="var(--tile-b)"/>
    </linearGradient>
    <linearGradient id="rim" x1="116" y1="172" x2="396" y2="346" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--rim-a)" stop-opacity="1"/>
      <stop offset="0.45" stop-color="var(--rim-b)" stop-opacity="0.28"/>
      <stop offset="1" stop-color="var(--rim-c)" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wave" x1="143" y1="215" x2="369" y2="297" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--wave-a)"/>
      <stop offset="0.5" stop-color="var(--wave-b)"/>
      <stop offset="1" stop-color="var(--wave-c)"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 284) rotate(90) scale(170 214)" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--halo)" stop-opacity="0.10"/>
      <stop offset="1" stop-color="var(--halo)" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="48" y="132" width="416" height="264" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="softGlow" x="110" y="177" width="292" height="158" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="islandClip">
      <rect x="91" y="177" width="330" height="158" rx="79"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="111.25" fill="none" stroke="var(--tile-stroke)" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="206" fill="url(#halo)"/>
  <path d="M96 153C136 92 194 62 256 62C318 62 376 92 416 153" fill="none" stroke="var(--arches)" stroke-opacity="0.07" stroke-width="2" stroke-linecap="round"/>
  <path d="M78 365C122 419 184 450 256 450C328 450 390 419 434 365" fill="none" stroke="var(--arches)" stroke-opacity="0.07" stroke-width="2" stroke-linecap="round"/>
  <rect x="112" y="190" width="288" height="132" rx="66" fill="var(--glow)" opacity="0.06" filter="url(#softGlow)"/>
  <g filter="url(#shadow)">
    <rect x="90" y="176" width="332" height="160" rx="80" fill="url(#rim)"/>
    <rect x="92" y="178" width="328" height="156" rx="78" fill="var(--island)"/>
    <rect x="93" y="179" width="326" height="154" rx="77" fill="none" stroke="var(--island-stroke)" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <g clip-path="url(#islandClip)" fill="url(#wave)">
    <rect x="137" y="239" width="8" height="34" rx="4" opacity="0.52"/>
    <rect x="151" y="230" width="8" height="52" rx="4" opacity="0.60"/>
    <rect x="165" y="216" width="8" height="80" rx="4" opacity="0.70"/>
    <rect x="179" y="226" width="8" height="60" rx="4" opacity="0.78"/>
    <rect x="193" y="207" width="8" height="98" rx="4" opacity="0.88"/>
    <rect x="207" y="221" width="8" height="70" rx="4" opacity="0.92"/>
    <rect x="221" y="235" width="8" height="42" rx="4"/>
    <rect x="235" y="214" width="8" height="84" rx="4"/>
    <rect x="249" y="199" width="14" height="114" rx="7"/>
    <rect x="269" y="214" width="8" height="84" rx="4"/>
    <rect x="283" y="235" width="8" height="42" rx="4"/>
    <rect x="297" y="221" width="8" height="70" rx="4" opacity="0.92"/>
    <rect x="311" y="207" width="8" height="98" rx="4" opacity="0.88"/>
    <rect x="325" y="226" width="8" height="60" rx="4" opacity="0.78"/>
    <rect x="339" y="216" width="8" height="80" rx="4" opacity="0.70"/>
    <rect x="353" y="230" width="8" height="52" rx="4" opacity="0.60"/>
    <rect x="367" y="239" width="8" height="34" rx="4" opacity="0.52"/>
  </g>

  <circle cx="256" cy="256" r="13" fill="var(--dot-fill)" stroke="var(--dot-stroke)" stroke-width="5"/>
  <path d="M267 267L281 281" stroke="var(--dot-stroke)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="383" cy="196" r="4" fill="var(--spot)"/>
</svg>
