<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Island for Quickshell</title>
  <desc id="desc">A dark editorial cover showing the Dynamic Island media player, waveform, themes and pixel clock.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Bricolage";
        src: url("../assets/BricolageGrotesque.ttf");
      }
      .display { font-family: "Bricolage", "Arial Black", sans-serif; }
      .utility { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
    </style>
    <linearGradient id="background" x1="82" y1="30" x2="1186" y2="624" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28251F"/>
      <stop offset="0.48" stop-color="#171714"/>
      <stop offset="1" stop-color="#090A0C"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
