  <text x="72" y="220" fill="#F7F7F5" class="display" font-size="72" font-weight="760" letter-spacing="-3.6">Dynamic</text>
  <text x="72" y="289" fill="#F7F7F5" class="display" font-size="72" font-weight="760" letter-spacing="-3.6">Island.</text>
